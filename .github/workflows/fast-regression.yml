name: MICU Pages deployment mirror integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published assets match pinned canonical Git blobs
        run: python3 scripts/verify-deployment-mirror.py
      - name: Verify GitHub Pages public HTTP after publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/verify-live-pages.py
